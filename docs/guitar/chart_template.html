<!doctype html>
<!--
  🎸 小節譜樣板（獨立的一頁：不連網、不用 SYNOX；可以直接打開，也可以填好發佈成 claude.ai Artifact）

  ▶ 資料注入點：下面 <script type="application/json" id="chart-data"> 裡的 JSON（格式見 packs/guitar/README.md「小節譜的格式」）。
    只要換掉那一段 JSON，其他都不用動；JSON 裡如果有 </ 要寫成 <\/。
  ▶ id="chord-lib" 那一段是和弦按法資料、「>>> 共用」標起來的 CSS／HTML／JS 是從 packs/guitar/panel.html 複製來的：
    不要手改，改完 panel.html 跑 python3 scripts/guitar_template.py 重新產生（--check 檢查有沒有跟上）。
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>吉他小節譜</title>
<style>
  :root { --bg: #f7f4ec; --card: #ffffff; --fg: #26221b; --muted: #736b5a; --line: #e3dbc8; --strong: #b7a98a;
          --accent: #8a4a22; --accent-ink: #ffffff; --root: #3c6358; --warn: #a23b3b; --chip: #f1e9d8; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1b1815; --card: #252119; --fg: #f1ebde; --muted: #b7ac96; --line: #3b3427;
      --strong: #5b5138; --accent: #e0925a; --accent-ink: #241408; --root: #7fb3a3; --warn: #e08080; --chip: #332c20; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #1b1815; --card: #252119; --fg: #f1ebde; --muted: #b7ac96; --line: #3b3427;
    --strong: #5b5138; --accent: #e0925a; --accent-ink: #241408; --root: #7fb3a3; --warn: #e08080; --chip: #332c20; color-scheme: dark; }
  /* >>> 共用 CSS */
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; background: var(--bg); color: var(--fg);
         font: 15px/1.5 system-ui, "PingFang TC", "Microsoft JhengHei", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  h2 { font-size: 14px; margin: 14px 0 6px; color: var(--accent); }
  .muted { color: var(--muted); font-size: 13px; }
  .warn { color: var(--warn); }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  button { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--strong);
           border-radius: 999px; padding: 6px 13px; cursor: pointer; }
  button.on, button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.sq { border-radius: 8px; min-width: 38px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  textarea, input, select { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--strong);
                            border-radius: 8px; padding: 7px 9px; }
  textarea { width: 100%; min-height: 160px; font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
             font-size: 14px; resize: vertical; }
  input[type=text] { width: 100%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .big { font-size: 20px; font-weight: 700; }
  pre.sheet { margin: 0; padding: 10px; background: var(--chip); border-radius: 8px; overflow-x: auto;
              font: 14px/1.55 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; white-space: pre; }
  .capo { padding: 6px 0; border-top: 1px dashed var(--line); font-size: 14px; }
  .capo:first-child { border-top: none; }
  .capo button { padding: 2px 10px; font-size: 13px; margin-left: 6px; }
  .pills { display: flex; gap: 5px; flex-wrap: wrap; margin: 6px 0; }
  .pills button { padding: 4px 10px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; margin-top: 8px; }
  .chord { border: 1px solid var(--line); border-radius: 10px; padding: 8px 6px; text-align: center; background: var(--bg); }
  .chord.hard { border-color: var(--accent); }
  .chord .nm { font-weight: 700; font-size: 16px; }
  .chord .lb { font-size: 11px; color: var(--muted); }
  .chord .tip { font-size: 11px; color: var(--muted); text-align: left; margin-top: 4px; }
  .chord .fr { font-size: 11px; letter-spacing: 1px; color: var(--muted); }
  /* 和弦圖：6 條弦（直）× 4 格（橫） */
  .dg { position: relative; width: 96px; height: 112px; margin: 4px auto 0; }
  .dg .str { position: absolute; top: 16px; width: 1px; height: 88px; background: var(--strong); }
  .dg .frt { position: absolute; left: 10px; width: 75px; height: 1px; background: var(--strong); }
  .dg .nut { height: 4px; background: var(--fg); }
  .dg .mk { position: absolute; top: 0; width: 14px; margin-left: -7px; text-align: center; font-size: 11px;
            line-height: 14px; color: var(--muted); }
  .dg .mk.rt { color: var(--root); font-weight: 700; }
  .dg .dot { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%;
             background: var(--accent); color: var(--accent-ink); font-size: 10px; line-height: 16px; font-weight: 700; }
  .dg .dot.rt { background: var(--root); }
  .dg .bar { position: absolute; height: 14px; margin-top: -7px; border-radius: 7px; background: var(--accent); opacity: .85; }
  .dg .pos { position: absolute; left: -2px; font-size: 10px; color: var(--muted); }
  .hidden { display: none; }
  label.ck { display: inline-flex; gap: 5px; align-items: center; font-size: 13px; cursor: pointer; }
  /* 小節譜 */
  .cmeta-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  .ctitle { font-size: 19px; font-weight: 700; }
  .cgrid-wrap { overflow-x: auto; margin-top: 6px; }
  .csec { margin: 10px 0 4px; }
  .csec-h { display: inline-block; font-size: 13px; font-weight: 700; color: var(--accent); border: 1px solid var(--accent);
            border-radius: 6px; padding: 0 8px; margin-bottom: 4px; }
  .crows { display: grid; grid-template-columns: repeat(var(--per, 4), minmax(min-content, 1fr));
           border-left: 2px solid var(--fg); }
  .cbar { border-right: 2px solid var(--fg); border-bottom: 1px solid var(--line); padding: 6px 6px 4px; min-height: 46px; min-width: 64px; }
  .cchords { display: flex; gap: 4px; align-items: baseline; }
  .cch { flex: 1 0 auto; font: 700 16px/1.3 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
         white-space: nowrap; background: none; border: none; border-radius: 4px; padding: 0 2px; text-align: left; color: var(--fg); }
  button.cch { cursor: pointer; }
  button.cch:hover, button.cch:focus-visible { background: var(--chip); }
  .cch.same, .cch.nc { color: var(--muted); font-weight: 400; }
  .cch.nc { font-style: italic; font-size: 13px; }
  .cch.unk { color: var(--warn); }
  .clyric { font-size: 12px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
  .grid.cused { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
  .chord.small .tip, .chord.small .lb { display: none; }
  .chord.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
  .photo { position: relative; margin-top: 8px; }
  .photo img { display: block; width: 100%; height: auto; border-radius: 8px; }
  .cmark { position: absolute; transform: translate(-50%, -50%); background: var(--accent); color: var(--accent-ink);
           font: 700 13px/1.2 ui-monospace, Menlo, Consolas, monospace; padding: 2px 6px; border-radius: 6px;
           box-shadow: 0 1px 3px rgba(0, 0, 0, .35); white-space: nowrap; pointer-events: none; }
  @media print {
    body { background: #fff; color: #000; padding: 0; }
    .noprint, .tabs, #status, h1 { display: none !important; }
    .card { border: none; padding: 0; background: #fff; }
    .crows, .cbar { border-color: #000; }
    .cch, .csec-h { color: #000; border-color: #000; }
    .cbar { break-inside: avoid; }
    .chord { break-inside: avoid; background: #fff; }
  }
  /* <<< 共用 CSS */
  body { padding: 16px; max-width: 980px; margin: 0 auto; }
  header.top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
  header.top h1 { margin: 0; }
  code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  @media print { header.top { display: none; } }
</style>
</head>
<body>
<header class="top"><h1>🎸 小節譜</h1><button id="theme" class="noprint" type="button">深色／淺色</button></header>
<section id="chart">
<!-- >>> 共用 HTML -->
  <div class="card noprint">
    <div class="muted">貼或打一段和弦進行，馬上排成一格一小節：<code>| C | G D/F# | Am | F |</code>、<code>C G Am F</code>、
      <code>[主歌]</code>／<code>前奏：</code>、<code>%</code>（同上一小節）、<code>N.C.</code>、<code>(x2)</code>、<code>Am . . G</code>（Am 三拍、G 一拍）；也可以貼小節譜 JSON。清空＝回到存的那份。</div>
    <textarea id="cin" spellcheck="false" placeholder="[主歌]&#10;| C | G D/F# | Am | F |&#10;| Dm7 | G | C | % | (x2)&#10;[副歌]&#10;F G Em Am"></textarea>
    <div class="row"><button id="cedit">把現在的譜放進來改（JSON）</button><span class="muted warn" id="cwarn"></span></div>
  </div>
  <div class="card noprint">
    <div class="row" style="margin-top:0">
      <button class="sq" id="cdown">−1</button><span class="big" id="cshift">原調</span><button class="sq" id="cup">＋1</button>
      <span class="muted">Capo</span><select id="ccapo"></select>
      <span class="muted">每行</span><select id="cper"></select>
    </div>
    <div class="row"><button id="ccopy">複製文字</button><button id="cprint">列印</button><span class="muted" id="ccopied"></span></div>
  </div>
  <div class="card">
    <div class="cmeta-row"><span class="ctitle" id="ctitle"></span></div>
    <div class="muted" id="cmeta"></div>
    <div><strong id="ckey"></strong></div>
    <div class="cgrid-wrap"><div id="cgrid"></div></div>
    <div class="muted" id="cnotes"></div>
    <h2>用到的和弦（點小節裡的和弦會跳到這裡）</h2>
    <div class="grid cused" id="cused"></div>
  </div>
  <div class="card noprint hidden" id="cphoto">
    <h2 style="margin-top:0">照片標記</h2>
    <div class="muted">這份譜有和弦在照片上的位置。選那張照片，和弦（跟著上面的移調、Capo）會標在照片上。照片只在這個頁面裡顯示，不會上傳、也不會存起來。</div>
    <div class="row"><input type="file" id="cfile" accept="image/*"></div>
    <div class="photo hidden" id="cimgbox"><img id="cimg" alt="譜的照片"><div id="cmarks"></div></div>
  </div>
<!-- <<< 共用 HTML -->
</section>

      if (kind === "same") { span.title = "同上一小節"; }
      if (kind === "unk") { span.title = "看不清楚的和弦"; }
      if (kind === "ch") { span.type = "button"; span.addEventListener("click", function () { flashChord(name); }); }
      line.appendChild(span);
    });
    cell.appendChild(line);
    if (lyric) { cell.appendChild(el("div", "clyric", lyric)); }
    return cell;
  }
  function renderChart() {
    var grid = $("cgrid"), used = $("cused");
    clear(grid); clear(used);
    if (!ct.chart || !ct.chart.sections.length) {
      $("ctitle").textContent = ""; $("cmeta").textContent = ""; $("ckey").textContent = ""; $("cnotes").textContent = "";
      grid.appendChild(el("div", "muted", "還沒有小節譜。在上面打一段進行（例：| C | G D/F# | Am | F |），或在聊天裡用 /chord_chart。"));
      renderPhoto(null);
      return;
    }
    var v = chartView(), c = v.chart, per = ct.per || c.bars_per_line || 4, bpb = beatsOf(c.time);
    $("ctitle").textContent = c.title || "小節譜";
    $("cmeta").textContent = [c.artist, "聽起來 " + keyName(v.sound) + " 調", c.time, c.tempo ? "♩=" + c.tempo : ""].filter(Boolean).join("・");
    $("ckey").textContent = v.capo ? "夾 Capo " + v.capo + "，照 " + keyName(v.shape) + " 調手型彈" : "不夾 capo，照 " + keyName(v.shape) + " 調彈";
    $("cshift").textContent = ct.shift === 0 ? "原調" : (ct.shift <= 6 ? "升 " + ct.shift : "降 " + (12 - ct.shift));
    $("cnotes").textContent = c.notes || "";
    c.sections.forEach(function (s) {
      var sec = el("div", "csec");
      if (s.name || s.repeat) { sec.appendChild(el("div", "csec-h", [s.name, s.repeat ? "×" + s.repeat : ""].filter(Boolean).join("　"))); }
      var rows = el("div", "crows");
      rows.style.setProperty("--per", per);
      s.bars.forEach(function (bar, i) { rows.appendChild(barCell(bar, (s.lyrics || [])[i], bpb)); });
      sec.appendChild(rows);
      grid.appendChild(sec);
    });
    chartNames(c).forEach(function (n) {
      var card = diagramFor(n, true);
      used.appendChild(card || el("div", "chord", n + "：沒有收錄"));
    });
    renderPhoto(c);
  }
  function renderPhoto(c) {
    var marks = c && c.image ? c.image.marks : [], box = $("cmarks");
    $("cphoto").classList.toggle("hidden", !marks.length);
    clear(box);
    if (!marks.length || !ct.photo) { $("cimgbox").classList.toggle("hidden", !ct.photo); return; }
    $("cimgbox").classList.remove("hidden");
    marks.forEach(function (m) {
      var tag = el("span", "cmark", m.chord);
      tag.style.left = (m.x * 100) + "%"; tag.style.top = (m.y * 100) + "%";
      box.appendChild(tag);
    });
  }
  function setChart(chart, warn) {
    ct.chart = chart; ct.shift = 0; ct.capo = null;
    var capoSel = $("ccapo");
    clear(capoSel);
    for (var i = 0; i <= 9; i++) { var o = el("option", null, i ? "第 " + i + " 格" : "不夾"); o.value = String(i); capoSel.appendChild(o); }
    capoSel.value = String(chart ? chart.capo : 0);
    $("cper").value = String(chart ? chart.bars_per_line : 4);
    ct.per = null;
    $("cwarn").textContent = (warn || []).join("；");
    renderChart();
  }
  function chartCopyText() {
    var v = chartView(), c = v.chart;
    var lines = ["🎸 " + chartHead(c)];
    if (v.capo) { lines.push("（夾 Capo " + v.capo + "、照 " + keyName(v.shape) + " 調手型，聽起來 " + keyName(v.sound) + " 調）"); }
    lines.push("", chartText(c, ct.per || c.bars_per_line));
    if (c.notes) { lines.push("", "📝 " + c.notes); }
    return lines.join("\n");
  }
  function mountChart(initial, warn) {
    ct.saved = initial;
    var per = $("cper");
    for (var i = 2; i <= 8; i++) { var o = el("option", null, i + " 小節"); o.value = String(i); per.appendChild(o); }
    $("cin").addEventListener("input", function () {
      var t = $("cin").value;
      if (!t.trim()) { setChart(ct.saved, []); return; }
      var r = chartInput(t);
      if (r[0] && r[0].sections.length) { setChart(r[0], r[1]); } else { $("cwarn").textContent = r[1].join("；") || "這裡面找不到和弦。"; }
    });
    $("cedit").addEventListener("click", function () { if (ct.chart) { $("cin").value = JSON.stringify(ct.chart, null, 1); } });
    $("cup").addEventListener("click", function () { ct.shift = mod(ct.shift + 1); renderChart(); });
    $("cdown").addEventListener("click", function () { ct.shift = mod(ct.shift - 1); renderChart(); });
    $("ccapo").addEventListener("change", function () { ct.capo = +$("ccapo").value; renderChart(); });
    per.addEventListener("change", function () { ct.per = +per.value; renderChart(); });
    $("ccopy").addEventListener("click", function () {
      if (!ct.chart) { return; }
      var t = chartCopyText(), msg = $("ccopied");
      if (navigator.clipboard) { navigator.clipboard.writeText(t).then(function () { msg.textContent = "已複製"; }, function () { msg.textContent = "複製不了，請手動選取"; }); }
    });
    $("cprint").addEventListener("click", function () { window.print(); });
    $("cfile").addEventListener("change", function () {
      var f = $("cfile").files && $("cfile").files[0];
      if (!f) { return; }
      var rd = new FileReader();                         // 只在這個頁面的記憶體裡：不上傳、不存
      rd.onload = function () { ct.photo = rd.result; $("cimg").src = ct.photo; renderChart(); };
      rd.readAsDataURL(f);
    });
    setChart(initial, warn);
  }
  // <<< 共用 JS

  var root = document.documentElement;
  $("theme").addEventListener("click", function () {
    var dark = root.getAttribute("data-theme") ? root.getAttribute("data-theme") === "dark"
      : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    root.setAttribute("data-theme", dark ? "light" : "dark");
  });
  var r;
  try { r = normalizeChart(JSON.parse($("chart-data").textContent)); } catch (e) { r = [null, ["chart-data 不是 JSON：" + e.message]]; }
  mountChart(r[0] && r[0].sections.length ? r[0] : null, r[1]);
})();
</script>
</body>
</html>
