<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>吉他和弦</title>
<style>
  :root { --bg: #f7f4ec; --card: #ffffff; --fg: #26221b; --muted: #736b5a; --line: #e3dbc8; --strong: #b7a98a;
          --accent: #8a4a22; --accent-ink: #ffffff; --root: #3c6358; --warn: #a23b3b; --chip: #f1e9d8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1815; --card: #252119; --fg: #f1ebde; --muted: #b7ac96; --line: #3b3427; --strong: #5b5138;
            --accent: #e0925a; --accent-ink: #241408; --root: #7fb3a3; --warn: #e08080; --chip: #332c20; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; background: var(--bg); color: var(--fg);
         font: 15px/1.5 system-ui, "PingFang TC", "Microsoft JhengHei", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  h2 { font-size: 14px; margin: 14px 0 6px; color: var(--accent); }
  .muted { color: var(--muted); font-size: 13px; }
  .warn { color: var(--warn); }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  button { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--strong);
           border-radius: 999px; padding: 6px 13px; cursor: pointer; }
  button.on, button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.sq { border-radius: 8px; min-width: 38px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  textarea, input, select { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--strong);
                            border-radius: 8px; padding: 7px 9px; }
  textarea { width: 100%; min-height: 160px; font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
             font-size: 14px; resize: vertical; }
  input[type=text] { width: 100%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .big { font-size: 20px; font-weight: 700; }
  pre.sheet { margin: 0; padding: 10px; background: var(--chip); border-radius: 8px; overflow-x: auto;
              font: 14px/1.55 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; white-space: pre; }
  .capo { padding: 6px 0; border-top: 1px dashed var(--line); font-size: 14px; }
  .capo:first-child { border-top: none; }
  .capo button { padding: 2px 10px; font-size: 13px; margin-left: 6px; }
  .pills { display: flex; gap: 5px; flex-wrap: wrap; margin: 6px 0; }
  .pills button { padding: 4px 10px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; margin-top: 8px; }
  .chord { border: 1px solid var(--line); border-radius: 10px; padding: 8px 6px; text-align: center; background: var(--bg); }
  .chord.hard { border-color: var(--accent); }
  .chord .nm { font-weight: 700; font-size: 16px; }
  .chord .lb { font-size: 11px; color: var(--muted); }
  .chord .tip { font-size: 11px; color: var(--muted); text-align: left; margin-top: 4px; }
  .chord .fr { font-size: 11px; letter-spacing: 1px; color: var(--muted); }
  /* 和弦圖：6 條弦（直）× 4 格（橫） */
  .dg { position: relative; width: 96px; height: 112px; margin: 4px auto 0; }
  .dg .str { position: absolute; top: 16px; width: 1px; height: 88px; background: var(--strong); }
  .dg .frt { position: absolute; left: 10px; width: 75px; height: 1px; background: var(--strong); }
  .dg .nut { height: 4px; background: var(--fg); }
  .dg .mk { position: absolute; top: 0; width: 14px; margin-left: -7px; text-align: center; font-size: 11px;
            line-height: 14px; color: var(--muted); }
  .dg .mk.rt { color: var(--root); font-weight: 700; }
  .dg .dot { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%;
             background: var(--accent); color: var(--accent-ink); font-size: 10px; line-height: 16px; font-weight: 700; }
  .dg .dot.rt { background: var(--root); }
  .dg .bar { position: absolute; height: 14px; margin-top: -7px; border-radius: 7px; background: var(--accent); opacity: .85; }
  .dg .pos { position: absolute; left: -2px; font-size: 10px; color: var(--muted); }
  .hidden { display: none; }
  label.ck { display: inline-flex; gap: 5px; align-items: center; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>
<h1>🎸 吉他和弦</h1>
<div class="tabs" id="tabs"></div>
<div id="status" class="muted">讀取中…</div>

<section id="tp" class="hidden">
  <div class="card">
    <div class="muted">把譜貼進來（和弦自己一行、或 [C] 夾在歌詞裡都可以）。上次在聊天裡貼的譜會自動放進來。</div>
    <textarea id="sheet" spellcheck="false" placeholder="G        D/F#&#10;我想你 我想你&#10;Em       C&#10;都是你的影子"></textarea>
    <div class="row">
      <span class="muted">原調</span><select id="src"></select>
      <button class="sq" id="down">−1</button>
      <span class="big" id="shift">不移調</span>
      <button class="sq" id="up">＋1</button>
      <span class="muted">新調</span><select id="dst"></select>
    </div>
    <div class="row"><label class="ck"><input type="checkbox" id="easy" checked>和弦圖優先用簡易按法</label></div>
  </div>
  <div class="card"><h2 style="margin-top:0">夾 Capo 的好彈選擇</h2><div id="capos"></div></div>
  <div class="card">
    <div class="row" style="margin-top:0"><strong id="outhead">移調後的譜</strong><button id="copy">複製</button><span class="muted" id="copied"></span></div>
    <pre class="sheet" id="out"></pre>
    <h2>這份譜用到的和弦</h2>
    <div class="grid" id="used"></div>
  </div>
</section>

<section id="look" class="hidden">
  <div class="card">
    <input type="text" id="q" placeholder="打和弦名稱：Am7、D/F#、Bbmaj7（可以一次好幾個）">
    <div class="pills" id="roots"></div>
    <div class="pills" id="quals"></div>
  </div>
  <div id="lookout"></div>
</section>

<section id="arp" class="hidden">
  <div class="card">
    <input type="text" id="arpq" value="Am F C G" placeholder="和弦：Am F C G">
    <div class="row"><span class="muted">型態</span><select id="pat"></select>
      <input type="text" id="patc" placeholder="或自己寫：T1213121" style="width:12em"></div>
    <div class="muted">T＝拇指彈最低那條弦（根音），1／2／3＝食指／中指／無名指彈第3／2／1弦。</div>
  </div>
  <div class="card"><pre class="sheet" id="tab"></pre></div>
</section>

<script>
(function () {
  "use strict";
  var SHARP = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  var FLAT = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];
  var NEUTRAL = ["C", "C#", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
  var KEY_MAJOR = ["C", "Db", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
  var KEY_MINOR = ["Cm", "C#m", "Dm", "D#m", "Em", "Fm", "F#m", "Gm", "G#m", "Am", "Bbm", "Bm"];
  var FLAT_KEYS = [1, 3, 5, 8, 10], SHARP_KEYS = [2, 4, 6, 7, 9, 11];
  var LETTER = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  var STRING_PC = [4, 9, 2, 7, 11, 4];
  var MINORISH = ["minor", "m7", "m6", "m9", "madd9", "mmaj7"], DIMISH = ["dim", "dim7", "m7b5"];
  var SUFFIX_OK = /^(?:maj|Maj|ma|min|mi|dom|sus|add|alt|aug|dim|omit|no|m|M|j|Δ|°|ø|-|\+|[0-9]|b|#|♭|♯|\(|\)|,)*$/;
  var CHORD_RE = /^([A-G])([#♯b♭]?)(.*?)(?:\/([A-G][#♯b♭]?))?$/;
  var DECOR = /^(?:[-–—\/%.*~>…_=]+|[x×X]\d+|\(?[x×X]?\d+[x×X]?\)?|N\.?C\.?|\d+\.|[(){}\[\]]+|\|+|:?\|\|?:?)$/;
  var SECTION = /^[\[(（【]?(?:intro|verse|pre-?chorus|chorus|bridge|outro|interlude|solo|ending|coda|riff|前奏|主歌|副歌|間奏|尾奏|橋段|導歌|過門|獨奏|結尾|[A-Z]\d?段?|[AB]'?|Capo.*|key.*|調.*)[\])）】]?\d*$/i;
  var WRAP = /^([(\[{（【]*)(.*?)([)\]}）】.,*!?;]*)$/;
  var D = null;                                   // 從自己的 API 拿的按法資料
  var st = { tab: "tp", n: 0, src: null, srcAuto: true, look: "C_minor", easy: true };

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) { e.className = cls; }
    if (text !== undefined && text !== null) { e.textContent = text; }
    return e;
  }
  function clear(e) { while (e.firstChild) { e.removeChild(e.firstChild); } }
  function mod(n) { return ((n % 12) + 12) % 12; }

  // ── 音名、調 ──
  function notePc(t) {
    if (!t || !(t[0] in LETTER)) { return null; }
    var pc = LETTER[t[0]];
    for (var i = 1; i < t.length; i++) {
      if ("#♯".indexOf(t[i]) >= 0) { pc += 1; } else if ("b♭".indexOf(t[i]) >= 0) { pc -= 1; } else { return null; }
    }
    return mod(pc);
  }
  function spell(pc, key) {
    pc = mod(pc);
    if (!key) { return NEUTRAL[pc]; }
    var major = key[1] ? mod(key[0] + 3) : key[0];
    if (FLAT_KEYS.indexOf(major) >= 0) { return FLAT[pc]; }
    if (SHARP_KEYS.indexOf(major) >= 0) { return (pc === 10 && major !== 6 && major !== 11) ? "Bb" : SHARP[pc]; }
    return NEUTRAL[pc];
  }
  function keyName(key) { return (key[1] ? KEY_MINOR : KEY_MAJOR)[mod(key[0])]; }

  // ── 和弦 ──
  function approx(sfx) {
    var s = sfx.replace(/[(),]/g, "");
    if (/^(maj|M|Δ|ma)/.test(s)) { return "maj7"; }
    if (/^(m|min|-)/.test(s)) { return /\d/.test(s) ? "m7" : "minor"; }
    if (/^6/.test(s)) { return "6"; }
    if (/^(dim|°)/.test(s)) { return "dim7"; }
    if (/^(aug|\+)/.test(s)) { return "aug"; }
    if (/^(add|sus)/.test(s)) { return "major"; }
    if (/^(7|9|11|13)/.test(s)) { return "7"; }
    return null;
  }
  function parseChord(text) {
    var m = CHORD_RE.exec((text || "").trim());
    if (!m || !SUFFIX_OK.test(m[3])) { return null; }
    var norm = m[3].replace(/♭/g, "b").replace(/♯/g, "#"), flat = norm.replace(/[()]/g, "");
    var map = D.suffix_map, q = map.hasOwnProperty(norm) ? map[norm] : (map.hasOwnProperty(flat) ? map[flat] : null);
    var ap = false;
    if (q === null) { q = approx(norm); ap = true; if (q === null) { return null; } }
    return { root: notePc(m[1] + m[2]), suffix: m[3], quality: q, approx: ap, bass: m[4] ? notePc(m[4]) : null,
             own: m[1] + m[2] + m[3] + (m[4] ? "/" + m[4] : "") };
  }
  function chordName(ch, shift, key) {
    var name = spell(ch.root + shift, key) + ch.suffix;
    if (ch.bass !== null) { name += "/" + spell(ch.bass + shift, key); }
    return name;
  }
  function stdSuffix(q) { for (var i = 0; i < D.qualities.length; i++) { if (D.qualities[i].id === q) { return D.qualities[i]; } } return null; }

  // ── 譜 ──
  function tokenChord(tok) {
    var m = WRAP.exec(tok), core = m ? m[2] : tok, ch = parseChord(core);
    return ch ? { ch: ch, pre: m[1], post: m[3] } : null;
  }
  function chordLine(line) {
    var re = /[^\s|:：]+/g, m, found = [], other = 0;
    while ((m = re.exec(line)) !== null) {
      var t = tokenChord(m[0]);
      if (t) { found.push({ start: m.index, end: m.index + m[0].length, ch: t.ch, pre: t.pre, post: t.post }); }
      else if (!DECOR.test(m[0]) && !SECTION.test(m[0])) { other += 1; }
    }
    return (found.length && !other) ? found : null;
  }
  function chordsIn(text) {
    var out = [];
    (text || "").split("\n").forEach(function (line) {
      var f = chordLine(line);
      if (f) { f.forEach(function (x) { out.push(x.ch); }); return; }
      var re = /\[([^\[\]\s]{1,16})\]/g, m;
      while ((m = re.exec(line)) !== null) { var c = parseChord(m[1]); if (c) { out.push(c); } }
    });
    return out;
  }
  function rewrite(text, fn) {
    return (text || "").split("\n").map(function (line) {
      var found = chordLine(line);
      if (!found) {
        return line.replace(/\[([^\[\]\s]{1,16})\]/g, function (all, inner) {
          var c = parseChord(inner); return c ? "[" + fn(c) + "]" : all;
        });
      }
      var out = "", prev = 0;
      found.forEach(function (f) {
        var gap = line.slice(prev, f.start);
        out += gap;
        if (gap && gap[gap.length - 1] === " " && out.length > f.start) {
          var over = out.length - f.start, trimmed = out.replace(/ +$/, ""), spaces = out.length - trimmed.length;
          out = trimmed + " ".repeat(Math.max(1, spaces - over));
        }
        out += f.pre + fn(f.ch) + f.post;
        prev = f.end;
      });
      return out + line.slice(prev);
    }).join("\n");
  }
  function kindOf(ch) {
    var q = ch.quality;
    if (MINORISH.indexOf(q) >= 0) { return "m"; }
    if (DIMISH.indexOf(q) >= 0) { return "d"; }
    if (["sus2", "sus4", "5", "7sus4"].indexOf(q) >= 0) { return "*"; }
    return "M";
  }
  function detectKey(chords) {
    if (!chords.length) { return null; }
    var dia = { 0: "M", 2: "m", 4: "m", 5: "M", 7: "M", 9: "m", 11: "d" }, best = null;
    var first = chords[0], last = chords[chords.length - 1];
    for (var t = 0; t < 12; t++) {
      var score = 0;
      chords.forEach(function (ch) {
        var deg = mod(ch.root - t);
        if (dia.hasOwnProperty(deg)) { score += (kindOf(ch) === dia[deg] || kindOf(ch) === "*") ? 1 : 0.3; }
      });
      [[first, 1], [last, 1.5]].forEach(function (p) {
        if (p[0].root === t && kindOf(p[0]) !== "m") { score += p[1]; }
        else if (p[0].root === mod(t + 9) && kindOf(p[0]) === "m") { score += p[1] * 0.8; }
      });
      if (best === null || score > best[0] + 1e-9) { best = [score, t]; }
    }
    var tt = best[1], rel = mod(tt + 9);
    var startsMinor = first.root === rel && kindOf(first) === "m", startsMajor = first.root === tt && kindOf(first) !== "m";
    var endsMinor = last.root === rel && kindOf(last) === "m";
    return (startsMinor || (endsMinor && !startsMajor)) ? [rel, true] : [tt, false];
  }

  // ── 按法 ──
  function slashFor(root, quality, bass) {
    for (var i = 0; i < D.slash.length; i++) {
      var s = D.slash[i], c = parseChord(s.name);
      if (c.root === root && c.quality === quality && c.bass === bass) { return s; }
    }
    return null;
  }
  function voicingsOf(root, quality, bass) {
    root = mod(root);
    if (bass !== null && bass !== undefined && mod(bass) !== root) {
      var s = slashFor(root, quality, mod(bass));
      if (s) { return [{ frets: s.frets, fingers: s.fingers, label: "常用斜線和弦", kind: "slash", tip: s.tip }]; }
      var base = D.lib[SHARP[root] + "_" + quality];
      if (!base) { return []; }
      return [{ frets: base[0].frets, fingers: base[0].fingers, label: "先彈 " + spell(root) + (stdSuffix(quality) || {}).suffix,
                kind: "approx", tip: "最低音改彈 " + spell(bass) + "（或省略低音）。聊天裡 /chord 會自動排出完整按法。" }];
    }
    return D.lib[SHARP[root] + "_" + quality] || [];
  }
  function difficulty(ch, shift) {
    var bass = ch.bass === null ? null : ch.bass + shift, vs = voicingsOf(ch.root + shift, ch.quality, bass);
    if (!vs.length) { return 4; }
    var kinds = vs.map(function (v) { return v.kind; });
    if (kinds.indexOf("open") >= 0) { return 0; }
    if (vs[0].kind === "slash" && vs[0].frets.indexOf(0) >= 0) { return 0.5; }
    if (kinds.indexOf("easy") >= 0 || kinds.indexOf("slash") >= 0 || kinds.indexOf("approx") >= 0) { return 1.5; }
    return 3;
  }
  function uniq(chords) {
    var seen = {}, out = [];
    chords.forEach(function (c) { var k = c.root + "|" + c.quality + "|" + c.bass; if (!seen[k]) { seen[k] = 1; out.push(c); } });
    return out;
  }
  function capoOptions(chords, key) {
    var u = uniq(chords), res = [];
    for (var capo = 0; capo < 8; capo++) {
      var shape = [mod(key[0] - capo), key[1]], cost = 0, hard = [], easy = [];
      u.forEach(function (ch) {
        var d = difficulty(ch, -capo);
        cost += d;
        if (d >= 3) { hard.push(chordName(ch, -capo, shape)); } else if (d >= 1.5) { easy.push(chordName(ch, -capo, shape)); }
      });
      res.push({ capo: capo, shape: shape, score: cost + capo * 0.25, hard: hard, easy: easy });
    }
    res.sort(function (a, b) { return a.score - b.score || a.capo - b.capo; });
    return res.slice(0, 3);
  }

  // ── 和弦圖（div，不用 SVG） ──
  function diagram(frets, fingers, root) {
    var box = el("div", "dg"), pressed = frets.filter(function (f) { return f; });
    var maxF = pressed.length ? Math.max.apply(null, pressed) : 0, minF = pressed.length ? Math.min.apply(null, pressed) : 0;
    var base = maxF > 4 ? minF : 1, x0 = 10, dx = 15, y0 = 16, dy = 22;
    function xOf(i) { return x0 + i * dx; }
    function yOf(f) { return y0 + (f - base) * dy + dy / 2; }
    for (var i = 0; i < 6; i++) { var s = el("div", "str"); s.style.left = xOf(i) + "px"; box.appendChild(s); }
    for (var f = 0; f <= 4; f++) {
      var line = el("div", "frt" + (f === 0 && base === 1 ? " nut" : ""));
      line.style.top = (y0 + f * dy - (f === 0 && base === 1 ? 2 : 0)) + "px";
      box.appendChild(line);
    }
    if (base > 1) { var p = el("div", "pos", base + "fr"); p.style.top = (y0 + 4) + "px"; p.style.left = "-22px"; box.appendChild(p); }
    var ones = [];
    frets.forEach(function (fr, i) { if (fr && fingers && fingers[i] === 1) { ones.push(i); } });
    var barre = null;
    if (ones.length >= 2 && ones.every(function (i) { return frets[i] === frets[ones[0]]; })) {
      barre = { fret: frets[ones[0]], from: Math.min.apply(null, ones), to: Math.max.apply(null, ones) };
      var b = el("div", "bar");
      b.style.left = (xOf(barre.from) - 7) + "px"; b.style.width = (xOf(barre.to) - xOf(barre.from) + 14) + "px";
      b.style.top = yOf(barre.fret) + "px";
      box.appendChild(b);
    }
    frets.forEach(function (fr, i) {
      var isRoot = root !== null && fr !== null && mod(STRING_PC[i] + fr) === root;
      if (fr === null || fr === 0) {
        var mk = el("div", "mk" + (isRoot ? " rt" : ""), fr === null ? "×" : (isRoot ? "●" : "○"));
        mk.style.left = xOf(i) + "px";
        box.appendChild(mk);
        return;
      }
      if (barre && fingers[i] === 1 && fr === barre.fret && !isRoot) { return; }
      var d = el("div", "dot" + (isRoot ? " rt" : ""), fingers && fingers[i] ? String(fingers[i]) : "");
      d.style.left = xOf(i) + "px"; d.style.top = yOf(fr) + "px";
      box.appendChild(d);
    });
    return box;
  }
  function fretsText(frets) { return frets.map(function (f) { return f === null ? "x" : String(f); }).join(" "); }
  function chordCard(name, v, root, extra) {
    var c = el("div", "chord" + (v.kind === "barre" ? " hard" : ""));
    c.appendChild(el("div", "nm", name));
    if (extra) { c.appendChild(el("div", "lb", extra)); }
    c.appendChild(diagram(v.frets, v.fingers, root));
    c.appendChild(el("div", "fr", fretsText(v.frets)));
    c.appendChild(el("div", "lb", v.label));
    if (v.tip) { c.appendChild(el("div", "tip", v.tip)); }
    return c;
  }
  function pickVoicing(vs) {
    if (st.easy && vs.length && vs[0].kind === "barre") {
      for (var i = 1; i < vs.length; i++) { if (vs[i].kind === "easy") { return vs[i]; } }
    }
    return vs[0];
  }

  // ── 分頁：移調 ──
  function keyOptions(sel, value, onlyMode) {
    clear(sel);
    for (var m = 0; m < 2; m++) {
      if (onlyMode !== undefined && !!m !== onlyMode) { continue; }
      for (var pc = 0; pc < 12; pc++) {
        var o = el("option", null, (m ? KEY_MINOR : KEY_MAJOR)[pc] + (m ? "（小調）" : ""));
        o.value = pc + "," + m;
        if (value && value[0] === pc && value[1] === !!m) { o.selected = true; }
        sel.appendChild(o);
      }
    }
  }
  function renderTp() {
    var text = $("sheet").value, chords = chordsIn(text);
    var out = $("out"), capos = $("capos"), used = $("used");
    clear(capos); clear(used);
    if (!chords.length) {
      out.textContent = text ? "這份譜裡找不到和弦。和弦要自己一行（C  G  Am  F），或寫成 [C] 夾在歌詞裡。" : "";
      $("shift").textContent = "不移調";
      return;
    }
    if (st.srcAuto || !st.src) { st.src = detectKey(chords); }
    var src = st.src, dst = [mod(src[0] + st.n), src[1]];
    keyOptions($("src"), src); keyOptions($("dst"), dst, src[1]);
    $("shift").textContent = st.n === 0 ? "不移調" : (st.n <= 6 ? "升 " + st.n : "降 " + (12 - st.n));
    $("outhead").textContent = keyName(src) + " → " + keyName(dst);
    out.textContent = rewrite(text, function (ch) { return chordName(ch, st.n, dst); });
    var moved = chords.map(function (c) {
      return { root: mod(c.root + st.n), suffix: c.suffix, quality: c.quality, bass: c.bass === null ? null : mod(c.bass + st.n) };
    });
    capoOptions(moved, dst).forEach(function (o, i) {
      var row = el("div", "capo");
      var names = [], seen = {};
      moved.forEach(function (c) { var n = chordName(c, -o.capo, o.shape); if (!seen[n]) { seen[n] = 1; names.push(n); } });
      var head = o.capo === 0 ? "不夾 capo" : "Capo " + o.capo + "，用 " + keyName(o.shape) + " 調手型";
      var notes = (o.hard.length ? ["要橫按：" + o.hard.join("、")] : []).concat(o.easy.length ? ["簡易按法：" + o.easy.join("、")] : []);
      row.appendChild(el("strong", null, (i === 0 ? "⭐ " : "") + head));
      row.appendChild(el("div", null, names.join("  ")));
      row.appendChild(el("div", "muted", notes.length ? notes.join("；") : "全部是開放和弦"));
      if (o.capo) {
        var b = el("button", null, "看這組手型的譜");
        b.addEventListener("click", function () {
          $("outhead").textContent = "夾 Capo " + o.capo + "、照 " + keyName(o.shape) + " 調手型彈（聽起來是 " + keyName(dst) + "）";
          out.textContent = rewrite(text, function (ch) { return chordName(ch, st.n - o.capo, o.shape); });
        });
        row.firstChild.appendChild(b);
      }
      capos.appendChild(row);
    });
    var seenU = {};
    moved.forEach(function (c) {
      var name = chordName(c, 0, dst);
      if (seenU[name]) { return; }
      seenU[name] = 1;
      var vs = voicingsOf(c.root, c.quality, c.bass);
      if (!vs.length) { used.appendChild(el("div", "chord", name + "：沒有收錄")); return; }
      used.appendChild(chordCard(name, pickVoicing(vs), c.root, c.approx ? "先用 " + spell(c.root, dst) + stdSuffix(c.quality).suffix : ""));
    });
  }
  function setN(n) { st.n = mod(n); renderTp(); }

  // ── 分頁：查和弦 ──
  function renderLook() {
    var out = $("lookout"), q = $("q").value.trim();
    clear(out);
    var list = [];
    if (q) {
      q.split(/[\s,，、]+/).forEach(function (t) { var c = parseChord(t); if (c) { list.push(c); } });
      if (!list.length) { out.appendChild(el("div", "card warn", "看不懂「" + q + "」。例：Am7、D/F#、Bbmaj7")); return; }
    } else {
      var p = st.look.split("_");
      list.push({ root: SHARP.indexOf(p[0]), quality: p.slice(1).join("_"), suffix: stdSuffix(p.slice(1).join("_")).suffix, bass: null });
    }
    var key = detectKey(list);
    list.forEach(function (c) {
      var card = el("div", "card"), name = c.own || chordName(c, 0, null), info = stdSuffix(c.quality);
      card.appendChild(el("div", "big", name));
      var tones = info.tones.map(function (iv) { return spell(c.root + iv, list.length > 1 ? key : null); }).join(" ");
      card.appendChild(el("div", "muted", info.label + "　組成音：" + tones + (c.bass !== null ? "　低音：" + spell(c.bass) : "")
        + (c.approx ? "　（" + c.suffix + " 先用 " + info.suffix + " 的按法，延伸音可以省略）" : "")));
      var grid = el("div", "grid");
      var vs = voicingsOf(c.root, c.quality, c.bass);
      if (!vs.length) { card.appendChild(el("div", "warn", "沒有收錄這個和弦的按法。")); }
      vs.forEach(function (v) { grid.appendChild(chordCard(name, v, c.root)); });
      card.appendChild(grid);
      out.appendChild(card);
    });
  }
  function buildPills() {
    var roots = $("roots"), quals = $("quals");
    clear(roots); clear(quals);
    var cur = st.look.split("_"), curQ = cur.slice(1).join("_");
    SHARP.forEach(function (r) {
      var b = el("button", r === cur[0] ? "on" : "", r.length > 1 ? r + "/" + FLAT[SHARP.indexOf(r)] : r);
      b.addEventListener("click", function () { st.look = r + "_" + curQ; $("q").value = ""; buildPills(); renderLook(); });
      roots.appendChild(b);
    });
    D.qualities.forEach(function (q) {
      var b = el("button", q.id === curQ ? "on" : "", q.suffix || "大三");
      b.title = q.label;
      b.addEventListener("click", function () { st.look = cur[0] + "_" + q.id; $("q").value = ""; buildPills(); renderLook(); });
      quals.appendChild(b);
    });
  }

  // ── 分頁：分散和弦 ──
  function renderArp() {
    var chords = [];
    $("arpq").value.split(/[\s,，、]+/).forEach(function (t) { var c = parseChord(t); if (c) { chords.push(c); } });
    var custom = $("patc").value.toUpperCase().replace(/[\s\-,.、]/g, "");
    var pat = /^[T123]{2,16}$/.test(custom) ? custom : $("pat").value;
    if (!chords.length) { $("tab").textContent = "打幾個和弦，例：Am F C G"; return; }
    var rows = [[], [], [], [], [], []], names = [], NAMES = ["e", "B", "G", "D", "A", "E"];
    chords.forEach(function (c) {
      var vs = voicingsOf(c.root, c.quality, c.bass);
      if (!vs.length) { return; }
      var fr = vs[0].frets, low = fr.findIndex(function (f) { return f !== null; });
      var width = Math.max(2, Math.max.apply(null, fr.filter(function (f) { return f !== null; }).map(function (f) { return String(f).length; })) + 1);
      names.push([c.own, pat.length * width]);
      rows.forEach(function (r) { r.push("|"); });
      pat.split("").forEach(function (tok) {
        var s = tok === "T" ? low : { "1": 3, "2": 4, "3": 5 }[tok], f = fr[s];
        for (var row = 0; row < 6; row++) {
          var cell = (5 - row) === s && f !== null ? String(f) : "";
          rows[row].push(cell + "-".repeat(width - cell.length));
        }
      });
    });
    var head = " " + names.map(function (n) { return " " + n[0] + " ".repeat(Math.max(0, n[1] - n[0].length)); }).join("");
    $("tab").textContent = [head.replace(/\s+$/, "")].concat(rows.map(function (r, i) { return NAMES[i] + r.join("") + "|"; })).join("\n");
  }

  // ── 分頁切換 ──
  var TABS = [["tp", "貼譜移調"], ["look", "查和弦"], ["arp", "分散和弦"]];
  function showTab(id) {
    st.tab = id;
    var bar = $("tabs");
    clear(bar);
    TABS.forEach(function (t) {
      var b = el("button", t[0] === id ? "on" : "", t[1]);
      b.addEventListener("click", function () { showTab(t[0]); });
      bar.appendChild(b);
      $(t[0]).classList.toggle("hidden", t[0] !== id);
    });
    if (id === "tp") { renderTp(); } else if (id === "look") { buildPills(); renderLook(); } else { renderArp(); }
  }

  function start(data) {
    D = data;
    $("status").textContent = "";
    $("sheet").value = data.last || "";
    D.patterns.forEach(function (p, i) { var o = el("option", null, (i + 1) + ". " + p.name + " " + p.seq); o.value = p.seq; $("pat").appendChild(o); });
    $("sheet").addEventListener("input", function () { st.srcAuto = true; renderTp(); });
    $("up").addEventListener("click", function () { setN(st.n + 1); });
    $("down").addEventListener("click", function () { setN(st.n - 1); });
    $("src").addEventListener("change", function () {
      var v = $("src").value.split(","); st.src = [+v[0], v[1] === "1"]; st.srcAuto = false; renderTp();
    });
    $("dst").addEventListener("change", function () {
      var v = $("dst").value.split(","); if (st.src) { setN(+v[0] - st.src[0]); }
    });
    $("easy").addEventListener("change", function () { st.easy = $("easy").checked; renderTp(); });
    $("copy").addEventListener("click", function () {
      var done = function () { $("copied").textContent = "已複製"; };
      if (navigator.clipboard) { navigator.clipboard.writeText($("out").textContent).then(done, function () { $("copied").textContent = "複製不了，請手動選取"; }); }
    });
    $("q").addEventListener("input", renderLook);
    ["arpq", "patc"].forEach(function (id) { $(id).addEventListener("input", renderArp); });
    $("pat").addEventListener("change", renderArp);
    showTab("tp");
  }

  fetch("/api/packs/guitar/data", { credentials: "same-origin" })
    .then(function (r) { if (!r.ok) { throw new Error(r.status); } return r.json(); })
    .then(start)
    .catch(function (e) { $("status").textContent = "讀不到和弦資料（" + e.message + "）"; $("status").className = "warn"; });
})();
</script>
</body>
</html>
