<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>待辦面板</title>
<style>
  :root { --bg: #ffffff; --fg: #1d2330; --muted: #5d6675; --line: #e6e9ef; --warn: #c0392b; --accent: #2f6fb5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171b22; --fg: #e7eaf0; --muted: #9aa3b2; --line: #2b313c; --warn: #e5675a; --accent: #6aa5e8; }
  }
  body { margin: 0; padding: 12px; background: var(--bg); color: var(--fg);
         font: 15px/1.5 system-ui, "Microsoft JhengHei", "PingFang TC", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 12px 0 4px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 4px 0; border-bottom: 1px solid var(--line); }
  .muted { color: var(--muted); font-size: 13px; }
  .warn { color: var(--warn); }
  .when { color: var(--accent); margin-right: 6px; font-variant-numeric: tabular-nums; }
  .mark { display: inline-block; width: 1.4em; text-align: center; }
  .done { color: var(--muted); text-decoration: line-through; }
</style>
</head>
<body>
<h1 id="title">✅ 待辦</h1>
<div class="muted" id="sub"></div>
<div id="sections"></div>
<script>
(function () {
  var marks = { 0: "", 1: "❗", 2: "‼️" };
  function section(name, rows, warn) {
    if (!rows.length) { return; }
    var box = document.getElementById("sections");
    var h = document.createElement("h2");
    h.textContent = name + "（" + rows.length + "）";
    if (warn) { h.className = "warn"; }
    box.appendChild(h);
    var ul = document.createElement("ul");
    rows.forEach(function (t) {
      var li = document.createElement("li");
      var text = "[" + t.id + "] " + (marks[t.priority] ? marks[t.priority] + " " : "") + t.text;
      if (t.due) { text += " · " + t.due; }
      t.tags.forEach(function (tag) { text += " #" + tag; });
      li.textContent = text;
      ul.appendChild(li);
    });
    box.appendChild(ul);
  }
  fetch("/api/packs/todo/today", { credentials: "same-origin" })
    .then(function (r) { if (!r.ok) { throw new Error(r.status); } return r.json(); })
    .then(function (d) {
      document.getElementById("title").textContent = "✅ " + d.label;
      document.getElementById("sub").textContent = d.open ? "還沒做完 " + d.open + " 項" : "沒有待辦 🎉";
      section("逾期", d.overdue, true);
      section("今天到期", d.due_today, false);
      section("之後", d.later, false);
    })
    .catch(function (e) { document.getElementById("sub").textContent = "讀不到（" + e.message + "）"; });
})();
</script>
</body>
</html>
